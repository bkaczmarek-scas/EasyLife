name: Zapis zmian do Notion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-sync:
    name: Sprawdź aplikację i dodaj wpis do Notion
    runs-on: ubuntu-latest
    if: ${{ secrets.NOTION_API_TOKEN != '' && secrets.NOTION_RELEASE_LOG_DATABASE_ID != '' }}
    env:
      NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      NOTION_RELEASE_LOG_DATABASE_ID: ${{ secrets.NOTION_RELEASE_LOG_DATABASE_ID }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Zainstaluj zależności
        run: npm ci

      - name: Sprawdź uruchamianie aplikacji
        run: |
          timeout 10s npm start &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:3000/api/status >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Dodaj wpis do Release logu w Notion
        env:
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          short_sha="${COMMIT_SHA:0:7}"
          message="${COMMIT_MESSAGE:-Zmiana dodana ręcznie}"
          title="main • $short_sha"
          commit_url="$SERVER_URL/$REPOSITORY/commit/$COMMIT_SHA"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          payload="$(jq -n \
            --arg title "$title" \
            --arg message "$message" \
            --arg commit_url "$commit_url" \
            --arg now "$now" \
            '{
              parent: {database_id: env.NOTION_RELEASE_LOG_DATABASE_ID},
              properties: {
                "Wersja": {title: [{text: {content: $title}}]},
                "Data wdrożenia": {date: {start: $now}},
                "Środowisko": {select: {name: "Production"}},
                "Status": {select: {name: "Zmiana w main"}},
                "Opis zmiany": {rich_text: [{text: {content: $message}}]},
                "Link do PR/release": {url: $commit_url},
                "Automatyczne": {checkbox: true}
              }
            }')"

          curl --fail-with-body --request POST \
            --url "https://api.notion.com/v1/pages" \
            --header "Authorization: Bearer $NOTION_API_TOKEN" \
            --header "Notion-Version: 2022-06-28" \
            --header "Content-Type: application/json" \
            --data "$payload"
