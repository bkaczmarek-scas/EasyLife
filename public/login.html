<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light dark">
<title>Sign in - EasyLife</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --surface-0:#f8fafc; --surface-2:#ffffff;
    --text-primary:#0f172a; --text-secondary:#475569;
    --border:#e2e8f0; --radius:8px; --radius-lg:12px;
    --accent:#0369a1; --accent-ring:#075985; --accent-contrast:#ffffff;
    --bg-warning:#fef2f2; --text-warning:#b91c1c;
    color-scheme: light;
    font-family: "Plus Jakarta Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --surface-0:#0b1220; --surface-2:#101a2c;
      --text-primary:#f1f5f9; --text-secondary:#94a3b8;
      --border:#22304a;
      --accent:#38bdf8; --accent-ring:#7dd3fc; --accent-contrast:#0b1220;
      --bg-warning:rgba(220,38,38,0.18); --text-warning:#f87171;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --surface-0:#0b1220; --surface-2:#101a2c;
    --text-primary:#f1f5f9; --text-secondary:#94a3b8;
    --border:#22304a;
    --accent:#38bdf8; --accent-ring:#7dd3fc; --accent-contrast:#0b1220;
    --bg-warning:rgba(220,38,38,0.18); --text-warning:#f87171;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--surface-0); color:var(--text-primary); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .card{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-lg); padding:32px; width:340px; max-width:100%; box-shadow:0 24px 48px rgba(15,23,42,0.08);}
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:24px;}
  .brand-name{font-weight:800; font-size:18px; letter-spacing:-0.01em;}
  h1{font-size:16px; font-weight:700; margin:0 0 4px;}
  p.sub{font-size:13px; color:var(--text-secondary); margin:0 0 24px;}
  .field{display:flex; flex-direction:column; gap:4px; margin-bottom:14px;}
  .field label{font-size:12px; color:var(--text-secondary);}
  input{font-size:13px; font-family:inherit; padding:9px 12px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface-2); width:100%;}
  input:focus{outline:none; border-color:var(--accent);}
  button{width:100%; margin-top:6px; font-size:13px; font-weight:600; font-family:inherit; padding:10px 16px; border:1px solid var(--accent); border-radius:var(--radius); background:var(--accent); color:var(--accent-contrast); cursor:pointer;}
  button:hover:not(:disabled){background:var(--accent-ring); border-color:var(--accent-ring);}
  button:disabled{opacity:0.5; cursor:not-allowed;}
  .error{display:none; background:var(--bg-warning); color:var(--text-warning); font-size:12px; padding:8px 12px; border-radius:var(--radius); margin-bottom:14px;}
</style>
<script>
  // Applied before first paint so the login screen matches whatever theme was last chosen
  // in the main app (localStorage is shared across pages on the same origin).
  (function () {
    var t = localStorage.getItem('theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="brand-name">EasyLife</div>
  </div>
  <h1>Sign in</h1>
  <p class="sub">Access your workspace.</p>
  <p class="error" id="loginError"></p>
  <form id="loginForm" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password">
    </div>
    <button type="submit" id="loginBtn">Log in</button>
  </form>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errorEl.style.display = 'none';

  if (!email) { errorEl.textContent = 'Please enter your email.'; errorEl.style.display = 'block'; return; }
  if (!password) { errorEl.textContent = 'Please enter your password.'; errorEl.style.display = 'block'; return; }

  btn.disabled = true;
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    window.location.href = '/';
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
});
</script>

</body>
</html>
